name: DevShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend
        working-directory: backend
        run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/devshop-backend:latest ./backend

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/devshop-frontend:latest ./frontend

      - name: Push backend Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/devshop-backend:latest

      - name: Push frontend Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/devshop-frontend:latest